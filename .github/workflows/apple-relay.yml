name: Temporary Apple TLS relay
on:
  push:
    branches: [diagnose-apple-install]
    paths: [.github/workflows/apple-relay.yml]
permissions:
  contents: read
concurrency:
  group: motolink-temporary-apple-relay
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm relay removed
        run: echo 'Temporary relay source and public key removed; prior relay cancelled by concurrency.'
