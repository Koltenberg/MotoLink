name: Build unsigned iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motolink-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test protocol, compile simulator, and package physical-device build
        shell: bash
        run: bash scripts/build-ios.sh
      - name: Upload unsigned IPA and package report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MotoLink-unsigned-iPhone-${{ github.run_number }}
          path: |
            build-artifacts/ios/**/MotoLink-unsigned.ipa
            build-artifacts/ios/**/MotoLink-unsigned.ipa.sha256
            build-artifacts/ios/**/package-validation.json
          if-no-files-found: error
          retention-days: 3
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MotoLink-build-logs-${{ github.run_number }}
          path: build-artifacts/ios/**/*.log
          if-no-files-found: warn
          retention-days: 3
