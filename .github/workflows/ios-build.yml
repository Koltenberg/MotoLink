name: Build unsigned iPhone IPA

on:
  push:
    branches: [main, codex/release-0.5.2, codex/release-0.5.3, codex/release-0.5.4]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: motolink-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # Pin a matching modern Xcode/runtime after macOS 15 / iOS 18.5
    # CoreSimulator startup failed on both ARM and Intel runners.
    runs-on: macos-26
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    timeout-minutes: 25
    steps:
      - name: Check out project
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Test protocol, compile simulator, and package physical-device build
        shell: bash
        env:
          MOTOLINK_SCREENSHOT: '1'
        run: bash scripts/build-ios.sh
      - name: Upload simulator visual checks
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: MotoLink-visual-checks-${{ github.run_number }}
          path: |
            build-artifacts/ios/**/*.png
            build-artifacts/ios/**/MotoLinkVisualOrientation.json
            build-artifacts/ios/**/MotoLinkRefreshLifecycle.json
            build-artifacts/ios/**/MotoLinkRideLifecycleAudit.json
            build-artifacts/ios/**/*.ready.json
          if-no-files-found: warn
          retention-days: 3
      - name: Upload unsigned IPA and package report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MotoLink-unsigned-iPhone-${{ github.run_number }}
          path: |
            build-artifacts/ios/**/MotoLink-unsigned.ipa
            build-artifacts/ios/**/MotoLink-unsigned.ipa.sha256
            build-artifacts/ios/**/package-validation.json
          if-no-files-found: warn
          retention-days: 3
      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: MotoLink-build-logs-${{ github.run_number }}
          path: build-artifacts/ios/**/*.log
          if-no-files-found: warn
          retention-days: 3
