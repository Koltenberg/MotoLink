name: Stop temporary Apple relay
on:
  push:
    branches: [diagnose-apple-install]
permissions:
  contents: read
concurrency:
  group: motolink-temporary-apple-relay
  cancel-in-progress: true
jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm previous relay cancellation
        run: echo 'No relay started. Temporary signing session finished.'
