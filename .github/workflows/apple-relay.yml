name: Temporary Apple TLS relay

on:
  workflow_dispatch:
  push:
    branches: [diagnose-apple-install]
    paths:
      - .github/workflows/apple-relay.yml
      - .github/temporary-apple-relay/**

permissions:
  contents: read

concurrency:
  group: motolink-temporary-apple-relay
  cancel-in-progress: true

jobs:
  relay:
    if: github.repository == 'Koltenberg/MotoLink' && github.ref == 'refs/heads/diagnose-apple-install'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Read only the temporary relay files
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          sparse-checkout: .github/temporary-apple-relay
      - name: Validate public key and prepare pinned dependencies
        run: bash .github/temporary-apple-relay/relay-runner.sh prepare
      - name: Start short-lived relay and publish public URL in logs
        run: bash .github/temporary-apple-relay/relay-runner.sh start
      - name: Publish public URL while the relay is running
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apple-relay-endpoint-${{ github.run_id }}
          path: ${{ runner.temp }}/motolink-apple-relay/endpoint.txt
          if-no-files-found: error
          retention-days: 1
      - name: Keep relay available within the 20-minute job budget
        run: bash .github/temporary-apple-relay/relay-runner.sh hold
      - name: Stop this job's relay processes
        if: always()
        run: bash .github/temporary-apple-relay/relay-runner.sh stop


