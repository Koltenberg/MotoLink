name: Close temporary Apple signing relay
on:
  push:
    branches: [diagnose-apple-install]
    paths: [.github/workflows/apple-relay.yml]
permissions:
  contents: read
concurrency:
  group: motolink-temporary-apple-relay
  cancel-in-progress: true
jobs:
  close:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Confirm relay cancellation
        run: echo 'Temporary signing session ended; no relay or keys in this tree.'
